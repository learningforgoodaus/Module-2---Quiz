<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 2: Knowledge Check</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Configure Brand Colors for Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Helvetica', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        'brand-light': '#C6B4D9',
                        'brand-medium': '#9C7F9D',
                        'brand-dark': '#513873',
                        'brand-darker': '#413659',
                        'brand-bg': '#F2F2F2',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Helvetica', 'Inter', sans-serif;
        }
        /* Style radio buttons and checkboxes with the brand color */
        input[type="radio"]:checked,
        input[type="checkbox"]:checked {
            accent-color: #513873; 
        }
        
        /* Custom focus rings to use brand color */
        input[type="radio"]:focus,
        input[type="checkbox"]:focus {
            outline: 2px solid #513873;
            outline-offset: 2px;
        }

        .option-wrapper {
            transition: all 0.2s ease;
        }
        
        .option-wrapper:hover {
            border-color: #9C7F9D;
            background-color: rgba(198, 180, 217, 0.1);
        }
    </style>
</head>
<body class="bg-brand-bg min-h-screen flex items-center justify-center p-4">

    <!-- Quiz Card Container -->
    <div class="bg-white shadow-2xl rounded-xl p-6 md:p-8 max-w-2xl w-full" id="quiz-container">
        
        <!-- Quiz Header -->
        <div id="quiz-header">
            <h1 class="text-2xl md:text-3xl font-bold text-brand-darker mb-2">Module 2 Knowledge Check</h1>
            <p class="text-sm text-gray-600 mb-6" id="question-counter">Question 1 of 5</p>
        </div>

        <!-- Question Area -->
        <div id="question-area">
            <h2 class="text-xl font-semibold text-brand-darker mb-5" id="question-text"></h2>
            
            <!-- Options Area -->
            <div class="space-y-3" id="options-container">
                <!-- Options will be dynamically inserted here -->
            </div>
        </div>

        <!-- Feedback Area -->
        <div class="mt-6 min-h-[2rem]">
            <p id="feedback-text" class="text-center font-semibold text-lg" aria-live="polite"></p>
        </div>

        <!-- Button Controls -->
        <div class="mt-4 space-y-3">
            <button id="check-btn" class="w-full bg-brand-dark text-white py-3 px-5 rounded-lg font-semibold hover:bg-brand-darker transition-colors focus:outline-none focus:ring-2 focus:ring-brand-dark focus:ring-offset-2">
                Check Answer
            </button>
        </div>
    </div>

    <!-- Correct Answer Modal (Pop-out) -->
    <div id="correct-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 hidden z-50" aria-modal="true" role="dialog">
        <div class="bg-white rounded-xl p-8 shadow-2xl text-center max-w-sm w-full transform transition-all">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Correct! Well done</h2>
            <p class="text-gray-600 mb-6">You've correctly identified the answer.</p>
            <button id="next-btn" class="w-full bg-white text-brand-dark border-2 border-brand-dark py-3 px-5 rounded-lg font-semibold hover:bg-gray-100 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-dark focus:ring-offset-2">
                Next Question
            </button>
        </div>
    </div>

    <!-- Completion Screen -->
    <div id="completion-screen" class="fixed inset-0 bg-brand-bg flex items-center justify-center p-4 hidden">
        <div class="bg-white shadow-2xl rounded-xl p-8 md:p-10 max-w-2xl w-full text-center">
            <div class="flex justify-center mb-6">
                <div class="bg-brand-light/30 p-5 rounded-full">
                    <svg class="w-12 h-12 text-brand-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>
            <h1 class="text-3xl font-bold text-brand-darker mb-4">Quiz Complete!</h1>
            <p class="text-xl text-gray-700">You have successfully completed the Module 2 Knowledge Check.</p>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- 1. DEFINE QUIZ DATA ---
            const quizData = [
                {
                    question: "Which of the following best describes domestic and family violence?",
                    type: "radio", 
                    options: [
                        { text: "Only physical harm between partners", id: "q1_a" },
                        { text: "Any behavior that is threatening, abusive, violent, coercive, or controlling, causing fear or loss of freedom", id: "q1_b" },
                        { text: "Arguments that happen in relationships", id: "q1_c" },
                        { text: "Only financial abuse", id: "q1_d" }
                    ],
                    correct: ["q1_b"]
                },
                {
                    question: "Which of the following are key drivers of domestic and family violence? (Select all that apply)",
                    type: "checkbox", 
                    options: [
                        { text: "Gender inequality and rigid gender roles", id: "q2_a" },
                        { text: "Social norms that condone violence", id: "q2_b" },
                        { text: "Structural and cultural discrimination", id: "q2_c" },
                        { text: "Stress from work", id: "q2_d" }
                    ],
                    correct: ["q2_a", "q2_b", "q2_c"]
                },
                {
                    question: "Domestic and family violence only happens in certain communities.",
                    type: "radio", 
                    options: [
                        { text: "True", id: "q3_a" },
                        { text: "False", id: "q3_b" }
                    ],
                    correct: ["q3_b"]
                },
                {
                    question: "Which of the following are myths about DFV? (Select all that apply)",
                    type: "checkbox", 
                    options: [
                        { text: "DFV only happens in certain types of families", id: "q4_a" },
                        { text: "Victim-survivors often face barriers to seeking help", id: "q4_b" },
                        { text: "DFV is complex and can involve multiple forms of abuse", id: "q4_c" },
                        { text: "Coercive control is not serious", id: "q4_d" }
                    ],
                    correct: ["q4_a", "q4_d"]
                },
                {
                    question: "Which stages are part of the cycle of violence? (Select all that apply)",
                    type: "checkbox", 
                    options: [
                        { text: "Tension building", id: "q5_a" },
                        { text: "Incident", id: "q5_b" },
                        { text: "Reconciliation", id: "q5_c" },
                        { text: "Calm", id: "q5_d" }
                    ],
                    correct: ["q5_a", "q5_b", "q5_c", "q5_d"]
                }
            ];

            // --- 2. GET ELEMENT REFERENCES ---
            const quizContainer = document.getElementById('quiz-container');
            const questionCounter = document.getElementById('question-counter');
            const questionText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const checkBtn = document.getElementById('check-btn');
            const nextBtn = document.getElementById('next-btn'); 
            const feedbackText = document.getElementById('feedback-text');
            const correctModal = document.getElementById('correct-modal');
            const completionScreen = document.getElementById('completion-screen');

            // --- 3. STATE VARIABLES ---
            let currentQuestionIndex = 0;

            // --- 4. FUNCTIONS ---

            function loadQuestion(index) {
                const question = quizData[index];
                
                // Update text
                questionCounter.textContent = `Question ${index + 1} of ${quizData.length}`;
                questionText.textContent = question.question;
                
                // Clear old options and feedback
                optionsContainer.innerHTML = '';
                feedbackText.textContent = '';
                feedbackText.className = 'text-center font-semibold text-lg';

                // Create and append new options
                question.options.forEach(option => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'option-wrapper border border-gray-200 rounded-lg transition-all hover:bg-brand-light/10';
                    
                    const label = document.createElement('label');
                    label.htmlFor = option.id;
                    label.className = 'flex items-start p-4 cursor-pointer w-full';
                    
                    label.innerHTML = `
                        <input type="${question.type}" id="${option.id}" name="question_${index}" value="${option.id}" class="mt-1 mr-4 flex-shrink-0 scale-125 accent-brand-dark">
                        <span class="flex-1 text-gray-800 leading-tight font-medium">${option.text}</span>
                    `;
                    
                    wrapper.appendChild(label);
                    optionsContainer.appendChild(wrapper);
                });

                // Show check button
                checkBtn.classList.remove('hidden');
                nextBtn.textContent = (currentQuestionIndex === quizData.length - 1) ? "Finish Quiz" : "Next Question";
            }

            function checkAnswer() {
                const question = quizData[currentQuestionIndex];
                const selectedInputs = optionsContainer.querySelectorAll('input:checked');
                
                if (selectedInputs.length === 0) {
                    feedbackText.textContent = "Please select an answer.";
                    feedbackText.className = 'text-center font-semibold text-lg text-red-600';
                    return;
                }

                let selectedAnswers = Array.from(selectedInputs).map(input => input.value);

                // Sort for comparison
                const correctAnswers = [...question.correct].sort();
                selectedAnswers.sort();

                const isCorrect = JSON.stringify(selectedAnswers) === JSON.stringify(correctAnswers);

                if (isCorrect) {
                    feedbackText.textContent = '';
                    correctModal.classList.remove('hidden');
                    checkBtn.classList.add('hidden');
                } else {
                    feedbackText.textContent = "Incorrect. Please try again.";
                    feedbackText.className = 'text-center font-semibold text-lg text-red-600';
                }
            }

            function nextQuestion() {
                correctModal.classList.add('hidden');
                currentQuestionIndex++;
                
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion(currentQuestionIndex);
                } else {
                    quizContainer.classList.add('hidden');
                    completionScreen.classList.remove('hidden');
                }
            }

            // --- 5. INITIALIZE & EVENT LISTENERS ---
            loadQuestion(currentQuestionIndex);

            checkBtn.addEventListener('click', checkAnswer);
            nextBtn.addEventListener('click', nextQuestion);
        });
    </script>
</body>
</html>
